# 多实例部署编排：PostgreSQL + Redis + 可横向扩展的后端
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --scale app=3
#
# 重要：`app` 服务不映射固定端口（用 ports 会导致第二个实例起不来），
# 对外暴露靠前置反向代理（nginx / 云 LB）。本文件只保证实例能起。
#
# 为什么必须配 Redis：
#   不配 HLZ_REDIS_URL 时，每个实例都会：
#     - 抢着做启动清扫（会删掉别的实例正在用的沙箱容器）
#     - 无差别 recover_stale_runtime（会杀掉别的实例正在跑的 generation）
#     - 停止信号/插话只在自己进程内生效（用户点了没反应、消息丢）
#   详见 docs/20261119-多实例部署实施报告.md

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: hlz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要设置 POSTGRES_PASSWORD}
      POSTGRES_DB: hlaudz
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 连接数上限要够：默认 100 条，后端每实例池 max_size=8。
    # 实例数 × 8 + 运维连接 < max_connections，否则会
    # `sorry, too many clients already`。
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlz -d hlaudz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # 只做协调（锁/心跳/停止标记/插话），不存业务数据，
    # 所以用 LRU 淘汰 + 不开持久化都安全。
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HLZ_DB_URL: postgresql://hlz:${POSTGRES_PASSWORD}@postgres:5432/hlaudz
      HLZ_REDIS_URL: redis://redis:6379/0
      HLZ_REDIS_PREFIX: hlz
      # 实例标识：**必须是每个副本各自唯一的值**，否则 owner 会撞。
      #
      # ⚠️ 不要写 `${HOSTNAME:-unknown}` —— compose 的 `${...}` 是从
      # **宿主 shell** 插值的，所有副本拿到同一个值，等于「保证撞车」。
      #
      # compose 的 `--scale` 下副本的 hostname 天然不同（容器 ID 前缀），
      # 所以不注入时 `hostname:pid` 也能区分。但容器里 PID 恒为 1，
      # 一旦编排器让所有副本 hostname 相同（hostNetwork / StatefulSet 未设
      # hostname / 某些 PaaS），所有副本的 owner 就都是 `web-0:1`。
      # 撞车的表现**不是启动失败，而是随机数据分叉**（跨实例判活失效）。
      #
      # 所以推荐显式注入一个稳定且唯一的标识：
      #   docker compose ... up -d        # 单副本/本地
      #   HLZ_INSTANCE_ID 留空即可（回退到 hostname:pid）
      #
      # K8s 里用 pod name（本就唯一）：
      #   env:
      #     - name: HLZ_INSTANCE_ID
      #       valueFrom: {fieldRef: {fieldPath: metadata.name}}
      #
      # 真撞了会被 `cluster.instances._claim_owner` 检测到并打 WARNING。
      HLZ_INSTANCE_ID: ${HLZ_INSTANCE_ID:-}
      # 沙箱：容器里跑容器需要挂 docker socket，风险很大。
      # 多实例部署建议先关闭沙箱（工具退回进程内执行），或每个实例
      # 独占一台机器后再打开。
      HLZ_SANDBOX_MODE: ${HLZ_SANDBOX_MODE:-off}
      # 多实例下必须关：这个开关让「路径 -> PG schema」，是测试隔离用的
      HLZ_PG_SCHEMA_PER_PATH: "0"
    volumes:
      - appdata:/app/backend/data
    # 不写 ports：多副本时固定端口会冲突。对外走下面的 nginx。

  # ---- 入口：粘性负载均衡 ----
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HLZ_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  appdata: