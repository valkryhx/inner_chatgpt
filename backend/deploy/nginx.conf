# nginx：Hlaudz 多实例入口（粘性 + SSE 友好）
#
# ## 为什么必须粘性
#
# 一次生成是一条持续几十秒到几分钟的 **SSE 长连接**，天然落在同一个上游
# （nginx 不会拆已建立的连接）。问题在**下一个请求**：
#
#   - 用户在实例 A 跑着生成，第二个标签页的请求落到 B
#     -> B 的进程内 `is_generation_live` 看不到 A 的任务。
#        已修：B 会先问 owner 死活，活着就返回 409（不再写坏数据）。
#   - 插话：B 不知道 A 上有活跃回合，会降级成"普通发送"。
#        已修：B 会走跨实例总线入队。
#   - runtime 缓存（MCP 连接、系统提示词）各实例各有一份，
#     配置变更只能失效本进程的缓存（有软 TTL 会自愈，但会滞后）。
#
# 修完之后**技术上不粘也能跑**，但粘性能避免上面每一类"短暂不一致"。
# 所以这里选择粘性作为默认。
#
# ## 为什么用 cookie 而不是 ip_hash
#
# `ip_hash` 在以下场景会失效：
#   - 用户走移动网络 / 代理池，出口 IP 会变（同一个会话被打散）
#   - 用户在 NAT 后面（一群人共享一个 IP，全压到一个实例）
#   - 前置还有一层 CDN / 云 LB 时，$remote_addr 是 CDN 的地址
#
# cookie 粘性直接识别"这是同一个浏览器"，不受网络路径影响。
#
# ## 为什么不直接上 `sticky` 指令
#
# nginx 开源版没有 `sticky`（那是 nginx Plus 商业版 / OpenResty 的模块）。
# 开源版的标准做法是 `hash $cookie_xxx consistent` —— 用一致哈希把同一个
# cookie 值固定映射到同一个上游，实例增减时只迁移一部分键。
#
# 前提：应用要下发这个 cookie。见下方 `hlz_sticky` 的说明。

upstream hlaudz_app {
    # 一致哈希：同一个 hlz_sticky 值始终落到同一个上游。
    # `consistent` 让实例增减时只重排一部分键（否则全部重排 = 全员掉线）。
    hash $cookie_hlz_sticky consistent;

    server app:8000 max_fails=3 fail_timeout=30s;

    # 多实例时逐个列出（compose --scale 下服务名解析不到所有副本，
    # 需要显式写容器名或用 DNS 服务发现）。示例：
    # server hlz-app-1:8000 max_fails=3 fail_timeout=30s;
    # server hlz-app-2:8000 max_fails=3 fail_timeout=30s;
    # server hlz-app-3:8000 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# 上游失败时的兜底：hash 全挂时不要 502，直接把请求打到任意一个存活的
# （宁可丢掉粘性，也不要用户看到错误页）。
map $upstream_status $hlz_fallback {
    default "";
    "502"   "1";
    "504"   "1";
}

server {
    listen 80;
    server_name _;

    # 生成可能跑很久（长任务 + 多轮工具调用），body 别太小
    client_max_body_size 100m;

    location / {
        proxy_pass http://hlaudz_app;
        proxy_http_version 1.1;

        # SSE 必需：清掉 Connection 让 nginx 用 keepalive 连上游，
        # 同时不向客户端声明 close（否则浏览器会在流结束前断开）
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 关键三项 ----
        # 1) 关缓冲：否则事件被 nginx 攒在缓冲区，前端看起来"卡住不动"
        proxy_buffering off;
        proxy_cache off;
        # 2) 分块传输：让数据一块块吐给客户端
        chunked_transfer_encoding on;
        # 3) 长超时：一次生成可能几分钟（含多次工具调用），
        #    默认 60s 会在生成中途把连接掐掉，用户看到"生成中断"
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # 粘性 cookie 由应用下发（见下），nginx 只读不写。
        # 如果应用还没下发，退化成「同一 IP 尽量同实例」：
        # 这里不做 ip_hash 兜底，因为混用两种策略会让映射更不稳定。
    }

    # 健康检查单独放（不打到上游，直接看 nginx 是否活着；
    # 也可以改成 proxy_pass 到某个固定实例探测应用健康）
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}

# ============================================================================
# 应用侧需要下发 hlz_sticky cookie
# ============================================================================
#
# nginx 只能"读" cookie 做哈希，**无法设置**它（`hash` 不产生响应头）。
# 需要应用在任意一个普通响应里下发一个稳定的随机值：
#
#   Set-Cookie: hlz_sticky=<随机 16 字节 hex>; Path=/; Max-Age=2592000; SameSite=Lax; HttpOnly
#
# 落地位置建议：/api/health 或登录响应（两者都必然被访问，且登录时
# 用户一定经过一次完整请求）。见 app/main.py 的 `_ensure_sticky_cookie`。
#
# 为什么不用「基于 user_id 的哈希 cookie」：
#   - 登录前没有 user_id（首屏、健康检查）
#   - 一个用户可能在多个设备/浏览器上，共用同一个值会把它们绑死到同一实例
#     随机值让每个浏览器各自粘一个实例，负载更均匀。
#
# ## 没有这个 cookie 会怎样
#
# 退化成「所有请求落到同一个上游」（因为 $cookie_hlz_sticky 为空，
# 空串的哈希是固定值）。这不会报错，但完全失去了负载均衡的意义。
# 所以应用必须下发它 —— 已实现在 main.py。