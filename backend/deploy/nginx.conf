# nginx：Hlaudz 多实例入口（粘性 + SSE 友好）
#
# ## 为什么必须粘性
#
# 一次生成是一条持续几十秒到几分钟的 **SSE 长连接**，天然落在同一个上游
# （nginx 不会拆已建立的连接）。问题在**下一个请求**：
#
#   - 用户在实例 A 跑着生成，第二个标签页的请求落到 B
#     -> B 的进程内 `is_generation_live` 看不到 A 的任务。
#        已修：B 会先问 owner 死活，活着就返回 409（不再写坏数据）。
#   - 插话：B 不知道 A 上有活跃回合，会降级成"普通发送"。
#        已修：B 会走跨实例总线入队。
#   - runtime 缓存（MCP 连接、系统提示词）各实例各有一份，
#     配置变更只能失效本进程的缓存（有软 TTL 会自愈，但会滞后）。
#
# 修完之后**技术上不粘也能跑**，但粘性能避免上面每一类"短暂不一致"。
# 所以这里选择粘性作为默认。
#
# ## 为什么用 cookie 而不是 ip_hash
#
# `ip_hash` 在以下场景会失效：
#   - 用户走移动网络 / 代理池，出口 IP 会变（同一个会话被打散）
#   - 用户在 NAT 后面（一群人共享一个 IP，全压到一个实例）
#   - 前置还有一层 CDN / 云 LB 时，$remote_addr 是 CDN 的地址
#
# cookie 粘性直接识别"这是同一个浏览器"，不受网络路径影响。
#
# ## 为什么不直接上 `sticky` 指令
#
# nginx 开源版没有 `sticky`（那是 nginx Plus 商业版 / OpenResty 的模块）。
# 开源版的标准做法是 `hash $cookie_xxx consistent` —— 用一致哈希把同一个
# cookie 值固定映射到同一个上游，实例增减时只迁移一部分键。
#
# 前提：应用要下发这个 cookie。见下方 `hlz_sticky` 的说明。

# ============================================================================
# 外壳（events / http）
# ============================================================================
#
# 本文件是**完整的 nginx 主配置**（被 compose 挂到 /etc/nginx/nginx.conf）。
# nginx 主配置要求 `events {}` 与 `http {}` 两个顶层块，`upstream` / `server`
# / `map` 只能出现在 `http` 里面 —— 缺了外壳会直接
# `"upstream" directive is not allowed here`，容器进重启循环（实测踩过）。
#
# worker_processes auto：每个 worker 是单线程事件循环，多个 worker 之间
# 不共享 upstream 的 consistent-hash 环，但哈希是**确定性**的，所以同一个
# cookie 在哪个 worker 上都算出同一个上游 —— 多 worker 安全。
# （对比：ip_hash 在多 worker 下也安全；轮询则每个 worker 各转各的。）

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 容器里没有 nginx 用户，用默认即可；临时目录必须在可写位置。
    access_log /dev/stdout;
    client_body_temp_path /tmp/cbt;
    proxy_temp_path /tmp/pt;
    fastcgi_temp_path /tmp/ft;
    uwsgi_temp_path /tmp/ut;
    scgi_temp_path /tmp/st;

    # SSE 需要的 MIME 与默认类型（缺 default_type 时 content-type 会丢）
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream hlaudz_app {
        # 粘性：同一个 hlz_sticky 值始终落到同一个上游。
        #
        # ⚠️ **不要加 `consistent`**（2026-11-19 实测，nginx 1.31.6）。
        #
        # ketama 环是按 **server 名字**建点的。`server app:8000` 在
        # `--scale app=3` 下由 docker 内嵌 DNS 解析出 **3 个 A 记录**
        # （.4 / .5 / .6），但它们在环上共用同一个名字 —— 三个点重合，
        # 落点无法区分，于是 `hash ... consistent` **退化成严格轮询**。
        # 实测：同一个 cookie 连发 6 次，命中 .4/.5/.6 各两次，精确轮转。
        #
        # 换回普通 `hash`（不带 consistent）就正常：
        #   同一 cookie × 10 -> 全部同一实例；
        #   60 个不同 cookie -> 18/20/22 分布在三个副本。
        #
        # 代价：实例增减时**大部分键要重排**（ketama 才只迁一部分）。
        # 对「扩容时已经在跑的会话」来说这可以接受：粘性丢了的后果是
        # 那一轮请求落到新实例，靠 §9.1 里列的「技术上不粘也能跑」兜住
        # （409 判活 + 跨实例插话 + 软 TTL 自愈）。真要 ketama 的平滑迁移，
        # 就得显式列出每个副本（下面注释里的写法），让环上的名字各不相同。
        hash $cookie_hlz_sticky;

        # `--scale app=3` 时 docker 内嵌 DNS 对服务名 `app` 返回**多个 A 记录**，
        # nginx 启动时会**全部**加进 upstream。
        #
        # 已实测确认（2026-11-19，两个容器 + network-alias，12 次请求）：
        #   MARKER_A 6 次 / MARKER_B 6 次，upstream_addr 分别是 .2 和 .3
        #   —— 均匀分流，不是"只有一个副本收到流量"。
        #
        # 但要注意**时机**：nginx 只在启动时解析一次。所以：
        #   - 先 `docker compose up -d --scale app=3`，再起 nginx；
        #   - 之后扩缩容必须 `docker compose restart nginx` 让 upstream 重算。
        # 不想管这个时机就显式列副本（下面注释的那种写法），或用 Traefik / 云 LB。
        #
        # 不写 max_fails：探测过它不是粘性失效的原因，但也没必要 ——
        # 三个副本同时挂掉时，靠下面 map 的兜底 + 客户端重试更可控。
        server app:8000;

        # 需要 ketama 平滑迁移，或需要精确控制副本时改成显式列表
        # （环上的名字必须各不相同，否则 `consistent` 又会退化成轮询）：
        # server hlzscale-app-1:8000;
        # server hlzscale-app-2:8000;
        # server hlzscale-app-3:8000;

        keepalive 32;
    }

    # 上游失败时的兜底：hash 全挂时不要 502，直接把请求打到任意一个存活的
    # （宁可丢掉粘性，也不要用户看到错误页）。
    map $upstream_status $hlz_fallback {
        default "";
        "502"   "1";
        "504"   "1";
    }

    server {
        listen 80;
        server_name _;

        # 生成可能跑很久（长任务 + 多轮工具调用），body 别太小
        client_max_body_size 100m;

        # ---- 静态资源：nginx 直接返回，不碰 app ----
        #
        # 2026-11-19 改：原来 `location /` 把**所有**请求（含 index.html、
        # JS、CSS）都代理给 hlaudz_app。那是错的 ——
        #
        #   1. 静态文件会跟着 `hash $cookie_hlz_sticky` 走粘性路由，
        #      而首次访问还没有 cookie（实测连发 3 次不带 cookie 会落到
        #      3 个不同实例），页面加载本身就把请求散到各实例上；
        #   2. 3 个 app 实例各存一份完全相同的 dist，纯冗余；
        #   3. app 实例在做生成时，还要分出 CPU/连接去喂静态文件。
        #
        # 现在静态文件在 nginx 镜像里（见 deploy/nginx.Dockerfile），
        # 只有 /api 走 proxy + 粘性 —— 那才是真正需要粘性的部分。
        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            # vite 产出的文件名带内容哈希（index-XXXXXXXX.js），可以长缓存。
            # 这是唯一能安全长缓存的前缀：内容一变文件名就变。
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback：`/`、`/session/abc` 这类前端路由都返回 index.html，
        # 由前端 router 处理。**不能**对不存在的 /api 路径也 fallback，
        # 那会把 "API 不存在" 变成 "返回一坨 HTML"，前端 JSON.parse 报错。
        location / {
            try_files $uri /index.html;

            # index.html 绝不长缓存：它引用的是带哈希的 assets，
            # 自己一缓存用户就永远看不到新版本。
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ---- API：proxy + 粘性 ----
        #
        # 所有后端路由都在 /api 下（grep 'APIRouter(prefix=' 确认过）。
        location /api/ {
            proxy_pass http://hlaudz_app;
            proxy_http_version 1.1;

            # SSE 必需：清掉 Connection 让 nginx 用 keepalive 连上游，
            # 同时不向客户端声明 close（否则浏览器会在流结束前断开）
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ---- SSE 关键三项 ----
            # 1) 关缓冲：否则事件被 nginx 攒在缓冲区，前端看起来"卡住不动"
            proxy_buffering off;
            proxy_cache off;
            # 2) 分块传输：让数据一块块吐给客户端
            chunked_transfer_encoding on;
            # 3) 长超时：一次生成可能几分钟（含多次工具调用），
            #    默认 60s 会在生成中途把连接掐掉，用户看到"生成中断"
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;

            # 粘性 cookie 由应用下发（见下），nginx 只读不写。
            # 如果应用还没下发，退化成「同一 IP 尽量同实例」：
            # 这里不做 ip_hash 兜底，因为混用两种策略会让映射更不稳定。
        }

        # 健康检查单独放（不打到上游，直接看 nginx 是否活着；
        # 也可以改成 proxy_pass 到某个固定实例探测应用健康）
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }

}

# ============================================================================
# 应用侧需要下发 hlz_sticky cookie
# ============================================================================
#
# nginx 只能"读" cookie 做哈希，**无法设置**它（`hash` 不产生响应头）。
# 需要应用在任意一个普通响应里下发一个稳定的随机值：
#
#   Set-Cookie: hlz_sticky=<随机 16 字节 hex>; Path=/; Max-Age=2592000; SameSite=Lax; HttpOnly
#
# 落地位置建议：/api/health 或登录响应（两者都必然被访问，且登录时
# 用户一定经过一次完整请求）。见 app/main.py 的 `_ensure_sticky_cookie`。
#
# 为什么不用「基于 user_id 的哈希 cookie」：
#   - 登录前没有 user_id（首屏、健康检查）
#   - 一个用户可能在多个设备/浏览器上，共用同一个值会把它们绑死到同一实例
#     随机值让每个浏览器各自粘一个实例，负载更均匀。
#
# ## 没有这个 cookie 会怎样
#
# 退化成「所有请求落到同一个上游」（因为 $cookie_hlz_sticky 为空，
# 空串的哈希是固定值）。这不会报错，但完全失去了负载均衡的意义。
# 所以应用必须下发它 —— 已实现在 main.py。